[project]
name = "forest"
version = "0.1.0"
description = "Simulation de feux de forêt"
readme = "README.md"
authors = [
    { name = "Josselin Davion Jouffre", email = "josselin.davion--jouffre@etu.minesparis.psl.eu" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
forest = "forest.main:main"

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

# CONFIGURATION RUFF (LINTING)
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # Conflit de docstring (requis par Ruff)
    "D213",    # Conflit de docstring (requis par Ruff)
    "COM812",  # Conflit de formatage (requis par Ruff)
    "ISC001",  # Conflit de formatage (requis par Ruff)
    "ANN101",  # On ignore le typage obligatoire de 'self'
]

[tool.ruff.lint.per-file-ignores]
"src/forest/tests/*" = ["S101", "D", "ANN", "SLF001"]

# CONFIGURATION MYPY (TYPAGE)
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "forest.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# CONFIGURATION PYTEST
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=src/forest --cov-report=term-missing"
testpaths = ["src/forest/tests"]